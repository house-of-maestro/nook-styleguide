<!doctype html><html><head><meta charset="utf-8"><style>body{background:#f4ebd9;color:#182920;font:14px/1.5 system-ui;padding:20px}h1{font:26px Georgia;margin:0 0 16px}button,a{display:block;background:#182920;color:#f4ebd9;border:0;border-radius:8px;padding:12px 18px;font:inherit;text-align:center;text-decoration:none;cursor:pointer}#download[hidden]{display:none}p{margin:14px 0}small{color:#45534a}</style></head><body><h1>Figma → Nook</h1><p>Export your current colors, spacing, radius, font variables and text styles. Your Figma file stays unchanged.</p><button id="export">Prepare website variables</button><a id="download" hidden download="figma-variables.json">Download figma-variables.json</a><p id="status" role="status"></p><small>Upload the downloaded file to nook-styleguide/design/ in GitHub. Vercel builds the updated styles automatically.</small><script>
let url;
document.getElementById('export').onclick=()=>{document.getElementById('status').textContent='Reading the library…';parent.postMessage({pluginMessage:{type:'export'}},'*');};
onmessage=event=>{const message=event.data.pluginMessage;if(!message)return;if(message.type==='error'){document.getElementById('status').textContent=message.message;return;}if(message.type!=='exported')return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([JSON.stringify(message.data,null,2)+'\n'],{type:'application/json'}));const link=document.getElementById('download');link.href=url;link.hidden=false;document.getElementById('export').hidden=true;document.getElementById('status').textContent=message.data.variables.length+' variables and '+message.data.textStyles.length+' text styles ready.';};
</script></body></html>
